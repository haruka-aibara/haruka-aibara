# パラメータグループの変更が再起動待ちで、まだ効いていない RDS インスタンスを NON_COMPLIANT にする。
# パラメータのルール（rds-mysql-require-secure-transport など）はグループの値で判定するので、
# このルールと両方 COMPLIANT なら「正しい値が実際に効いている」と言える。
# どのパラメータが再起動待ちかは API から分からないので、パラメータを問わず再起動待ちなら対象にする。
description: 再起動待ちのパラメータ変更が残っている RDS インスタンス
resource: aws.rds
filters:
  - type: value
    key: DBParameterGroups[].ParameterApplyStatus
    op: contains
    value: pending-reboot
