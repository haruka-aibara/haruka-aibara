# YAML / GitHub Actions / HTML / Markdown の構文チェックと、ワークフローのセキュリティ検査。
# Terraform 管理外（ci/ から配布される terraform-ci.yml / python-ci.yml とは別物）なので
# このファイルは直接編集してよい。
# 導入の経緯とルールの取捨は docs/decisions/0002-lint-ci-for-docs-and-config.md。
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: git ls-files -z '*.yml' '*.yaml' | xargs -0 uvx yamllint --strict -f github

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # run: 内のシェルもイメージ同梱の shellcheck で検査される。
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # 設定は .github/zizmor.yml。ci/workflows/ は配布元なのでここで一緒に見る。
      - run: uvx zizmor@1.30.1 --offline --format github .github/workflows ci/workflows/*.yml

  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # 設定は .htmlvalidate.json。docs の記事は単一ファイル HTML なので inline style などは許可している。
      - run: git ls-files -z '*.html' | xargs -0 npx --yes html-validate@11 --formatter stylish

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # 設定と対象外のファイルは .markdownlint-cli2.jsonc。
      # 手元では `npx markdownlint-cli2 --fix "**/*.md"` で空行まわりを自動修正できる。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npx --yes markdownlint-cli2@0.23 "**/*.md"
