# devcontainer の features（devcontainer.json と devcontainer-lock.json）は Dependabot が更新する。
# Renovate は devcontainer-lock.json を更新できないため、Renovate 側の devcontainer マネージャーは無効にしてある。
version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /devcontainer-templates/src/haruka-aibara-dev-env
    schedule:
      interval: weekly
    groups:
      devcontainer-features:
        patterns: ["*"]
