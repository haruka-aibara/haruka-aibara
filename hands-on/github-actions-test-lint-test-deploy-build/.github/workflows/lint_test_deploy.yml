name: lint test deploy
on: push
jobs:
  lint-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: install eslint
        run: npm install eslint
      - name: lint
        run: eslint --ext .jsx --fix src
      - name: test
        run: vitest run
      - name: build
        run: vite build

