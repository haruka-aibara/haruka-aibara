<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ビーコン信号</title>
<style>
:root{
  --bg:#fbfaf8; --card:#fff; --ink:#23201d; --muted:#6b645c; --line:#e3ded6;
  --lane:#eeeae4; --warn-bg:#fdf3f1; --warn-line:#e0b4ac;
  --c1:#3d6b9c; --c2:#b8562f; --c3:#5f8248; --c4:#7a63a0; --stop:#c2453a; --on:#fff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17161a; --card:#1e1d22; --ink:#e8e4dd; --muted:#9d968c; --line:#34323a;
    --lane:#2a2830; --warn-bg:#2a1e1d; --warn-line:#6b3b35;
    --c1:#5c8cc0; --c2:#cf6c42; --c3:#77a05c; --c4:#9680bd; --stop:#d75b4f; --on:#15141a;
  }
}
*{box-sizing:border-box}
body{
  margin:0;padding:2.5rem 1.25rem 5rem;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.85;font-size:16px;
}
main{max-width:52rem;margin:0 auto}
h1{font-size:1.9rem;line-height:1.35;margin:0 0 .4rem}
.lede{color:var(--muted);margin:0 0 2.5rem;font-size:1.02rem}
h2{font-size:1.25rem;margin:3rem 0 .6rem;padding-top:1.4rem;border-top:1px solid var(--line)}
h3{font-size:1.02rem;margin:1.8rem 0 .4rem}
p{margin:.7rem 0}
figure{margin:1.4rem 0;padding:1.1rem 1.1rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
figure svg{display:block;width:100%;height:auto}
figcaption{margin-top:.7rem;font-size:.86rem;color:var(--muted);line-height:1.7}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:.9rem 1.1rem;margin:1.4rem 0}
.note strong{color:var(--stop)}
table{border-collapse:collapse;width:100%;margin:1.2rem 0;font-size:.93rem}
th,td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
th{background:var(--lane);font-weight:600}
code{background:var(--lane);padding:.1em .4em;border-radius:4px;font-size:.9em}
ul{padding-left:1.3rem}li{margin:.35rem 0}
a{color:var(--c1)}
</style>
</head>
<body>
<main>

<h1>ビーコン信号</h1>
<p class="lede">端末の「Wi-Fi 一覧」は、どうやって埋まっているのか。</p>
<h2>AP が定期的に自分から名乗っている</h2>
<p>アクセスポイントは、何も聞かれていなくても<strong>一定間隔で「ここに私がいます」という短いフレームを送り続けている</strong>。これがビーコン信号で、既定ではおよそ 100 ミリ秒ごと。端末はこれを受け取って、電波の届く AP の一覧を作る。</p>

<figure>
<svg viewBox="0 0 700 226" role="img" aria-label="APが定期的に名乗り端末の一覧が埋まる様子">
<defs><marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--c1)"/></marker></defs><g transform="translate(20,84)"><line x1="12" y1="0" x2="7" y2="-19" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><line x1="32" y1="0" x2="37" y2="-19" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><circle cx="7" cy="-21" r="2.2" fill="var(--ink)"/><circle cx="37" cy="-21" r="2.2" fill="var(--ink)"/><rect x="0" y="0" width="44" height="16" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/><circle cx="10" cy="8" r="2" fill="var(--ink)"/><circle cx="19" cy="8" r="2" fill="var(--ink)" opacity=".45"/></g><text x="42" y="116" font-size="10.5" fill="var(--muted)" text-anchor="middle">アクセスポイント</text><path d="M90.4 73.6 A26 26 0 0 1 90.4 110.4" fill="none" stroke="var(--c1)" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/><path d="M100.3 63.7 A40 40 0 0 1 100.3 120.3" fill="none" stroke="var(--c1)" stroke-width="1.6" stroke-linecap="round" opacity="0.43"/><path d="M110.2 53.8 A54 54 0 0 1 110.2 130.2" fill="none" stroke="var(--c1)" stroke-width="1.6" stroke-linecap="round" opacity="0.31"/><rect x="190" y="22" width="230" height="124" rx="8" fill="var(--card)" stroke="var(--c1)" stroke-width="1.4"/><text x="305" y="46" font-size="11" fill="var(--c1)" text-anchor="middle" font-weight="600">ビーコンに載っているもの</text><text x="305" y="74" font-size="10.5" fill="var(--ink)" text-anchor="middle">ESSID（ネットワークの名前）</text><text x="305" y="98" font-size="10.5" fill="var(--ink)" text-anchor="middle">対応している通信速度</text><text x="305" y="122" font-size="10.5" fill="var(--ink)" text-anchor="middle">暗号方式・チャネル・時刻</text><line x1="432" y1="84" x2="512" y2="84" stroke="var(--c1)" stroke-width="1.6" marker-end="url(#b1)"/><rect x="520" y="22" width="160" height="124" rx="8" fill="var(--card)" stroke="var(--ink)" stroke-width="1.4"/><text x="600" y="46" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600">端末の Wi-Fi 一覧</text><path d="M538.6 71.5 A7 7 0 0 1 549.4 71.5" fill="none" stroke="var(--c1)" stroke-width="1.3" stroke-linecap="round" opacity="0.80"/><path d="M535.6 68.9 A11 11 0 0 1 552.4 68.9" fill="none" stroke="var(--c1)" stroke-width="1.3" stroke-linecap="round" opacity="0.62"/><text x="608" y="80" font-size="10.5" fill="var(--muted)" text-anchor="middle">office-wifi</text><path d="M538.6 101.5 A7 7 0 0 1 549.4 101.5" fill="none" stroke="var(--c1)" stroke-width="1.3" stroke-linecap="round" opacity="0.80"/><path d="M535.6 98.9 A11 11 0 0 1 552.4 98.9" fill="none" stroke="var(--c1)" stroke-width="1.3" stroke-linecap="round" opacity="0.62"/><text x="600" y="110" font-size="10.5" fill="var(--muted)" text-anchor="middle">guest</text><path d="M538.6 127.5 A7 7 0 0 1 549.4 127.5" fill="none" stroke="var(--c1)" stroke-width="1.3" stroke-linecap="round" opacity="0.50"/><path d="M535.6 124.9 A11 11 0 0 1 552.4 124.9" fill="none" stroke="var(--c1)" stroke-width="1.3" stroke-linecap="round" opacity="0.39"/><text x="590" y="136" font-size="10.5" fill="var(--muted)" text-anchor="middle">…</text><line x1="30" y1="186" x2="660" y2="186" stroke="var(--line)" stroke-width="1.4"/><path d="M53.9 180.9 A8 8 0 0 1 66.1 180.9" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.60"/><path d="M50.0 177.6 A13 13 0 0 1 70.0 177.6" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.47"/><path d="M153.9 180.9 A8 8 0 0 1 166.1 180.9" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.60"/><path d="M150.0 177.6 A13 13 0 0 1 170.0 177.6" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.47"/><path d="M253.9 180.9 A8 8 0 0 1 266.1 180.9" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.60"/><path d="M250.0 177.6 A13 13 0 0 1 270.0 177.6" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.47"/><path d="M353.9 180.9 A8 8 0 0 1 366.1 180.9" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.60"/><path d="M350.0 177.6 A13 13 0 0 1 370.0 177.6" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.47"/><path d="M453.9 180.9 A8 8 0 0 1 466.1 180.9" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.60"/><path d="M450.0 177.6 A13 13 0 0 1 470.0 177.6" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.47"/><path d="M553.9 180.9 A8 8 0 0 1 566.1 180.9" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.60"/><path d="M550.0 177.6 A13 13 0 0 1 570.0 177.6" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.47"/><text x="350" y="214" font-size="10.5" fill="var(--muted)" text-anchor="middle">何も聞かれていなくても、約 100ms ごとに送り続けている</text>
</svg>
<figcaption>ビーコンは暗号化されない。名前も暗号方式も、接続していない誰にでも読める。</figcaption>
</figure>

</main>
</body>
</html>
