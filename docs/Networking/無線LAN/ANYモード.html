<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANY モード</title>
<style>
:root{
  --bg:#fbfaf8; --card:#fff; --ink:#23201d; --muted:#6b645c; --line:#e3ded6;
  --lane:#eeeae4; --warn-bg:#fdf3f1; --warn-line:#e0b4ac;
  --c1:#3d6b9c; --c2:#b8562f; --c3:#5f8248; --c4:#7a63a0; --stop:#c2453a; --on:#fff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17161a; --card:#1e1d22; --ink:#e8e4dd; --muted:#9d968c; --line:#34323a;
    --lane:#2a2830; --warn-bg:#2a1e1d; --warn-line:#6b3b35;
    --c1:#5c8cc0; --c2:#cf6c42; --c3:#77a05c; --c4:#9680bd; --stop:#d75b4f; --on:#15141a;
  }
}
*{box-sizing:border-box}
body{
  margin:0;padding:2.5rem 1.25rem 5rem;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.85;font-size:16px;
}
main{max-width:52rem;margin:0 auto}
h1{font-size:1.9rem;line-height:1.35;margin:0 0 .4rem}
.lede{color:var(--muted);margin:0 0 2.5rem;font-size:1.02rem}
h2{font-size:1.25rem;margin:3rem 0 .6rem;padding-top:1.4rem;border-top:1px solid var(--line)}
h3{font-size:1.02rem;margin:1.8rem 0 .4rem}
p{margin:.7rem 0}
figure{margin:1.4rem 0;padding:1.1rem 1.1rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
figure svg{display:block;width:100%;height:auto}
figcaption{margin-top:.7rem;font-size:.86rem;color:var(--muted);line-height:1.7}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:.9rem 1.1rem;margin:1.4rem 0}
.note strong{color:var(--stop)}
table{border-collapse:collapse;width:100%;margin:1.2rem 0;font-size:.93rem}
th,td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
th{background:var(--lane);font-weight:600}
code{background:var(--lane);padding:.1em .4em;border-radius:4px;font-size:.9em}
ul{padding-left:1.3rem}li{margin:.35rem 0}
a{color:var(--c1)}
</style>
</head>
<body>
<main>

<h1>ANY モード</h1>
<p class="lede">「名前は指定しないので、いる AP は全部返事して」という探し方。</p>
<h2>端末が白紙で呼びかける</h2>
<p>端末が AP を探すとき、ESSID の欄を空（または <code>ANY</code>）にしたプローブ要求を出す方法がある。受け取った AP は自分の名前を返すので、端末は近くの AP を一通り集められる。Wi-Fi 一覧が埋まるのはこの仕組みでもある。</p>
<p>AP 側にはこれを<strong>拒否する設定</strong>（ANY 接続拒否）があり、有効にすると「名前を指定していない呼びかけ」には応答しなくなる。ステルスモードと組み合わせて使われる。</p>

<figure>
<svg viewBox="0 0 700 140" role="img" aria-label="ANYを許可した場合と拒否した場合のAPの応答の違い">
<defs><marker id="y1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--c1)"/></marker><marker id="y2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--c3)"/></marker><marker id="y3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><text x="0" y="13" font-size="11.5" fill="var(--c1)" text-anchor="start" font-weight="600">ANY を許可（既定）</text><g transform="translate(4,40)"><rect x="0" y="0" width="24" height="40" rx="3.5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/><rect x="3" y="5" width="18" height="27" rx="1" fill="var(--ink)" opacity=".13"/><circle cx="12" cy="36" r="1.6" fill="var(--ink)"/></g><text x="16" y="110" font-size="10.5" fill="var(--muted)" text-anchor="middle">端末</text><line x1="40" y1="46" x2="240" y2="46" stroke="var(--c1)" stroke-width="1.6" marker-end="url(#y1)"/><text x="140" y="38" font-size="10.5" fill="var(--c1)" text-anchor="middle">「誰かいますか？」</text><text x="140" y="62" font-size="10" fill="var(--muted)" text-anchor="middle">名前を指定しない</text><line x1="240" y1="84" x2="40" y2="84" stroke="var(--c3)" stroke-width="1.6" marker-end="url(#y2)"/><text x="140" y="104" font-size="10.5" fill="var(--c3)" text-anchor="middle">「office-wifi です」</text><g transform="translate(248,52)"><line x1="12" y1="0" x2="7" y2="-19" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><line x1="32" y1="0" x2="37" y2="-19" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><circle cx="7" cy="-21" r="2.2" fill="var(--ink)"/><circle cx="37" cy="-21" r="2.2" fill="var(--ink)"/><rect x="0" y="0" width="44" height="16" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/><circle cx="10" cy="8" r="2" fill="var(--ink)"/><circle cx="19" cy="8" r="2" fill="var(--ink)" opacity=".45"/></g><text x="270" y="84" font-size="10.5" fill="var(--muted)" text-anchor="middle">AP</text><line x1="350" y1="4" x2="350" y2="130" stroke="var(--line)" stroke-width="1"/><text x="370" y="13" font-size="11.5" fill="var(--c3)" text-anchor="start" font-weight="600">ANY を拒否</text><g transform="translate(374,40)"><rect x="0" y="0" width="24" height="40" rx="3.5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/><rect x="3" y="5" width="18" height="27" rx="1" fill="var(--ink)" opacity=".13"/><circle cx="12" cy="36" r="1.6" fill="var(--ink)"/></g><text x="386" y="110" font-size="10.5" fill="var(--muted)" text-anchor="middle">端末</text><line x1="410" y1="46" x2="610" y2="46" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#y3)"/><text x="510" y="38" font-size="10.5" fill="var(--muted)" text-anchor="middle">「誰かいますか？」</text><g transform="translate(618,52)"><line x1="12" y1="0" x2="7" y2="-19" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><line x1="32" y1="0" x2="37" y2="-19" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/><circle cx="7" cy="-21" r="2.2" fill="var(--ink)"/><circle cx="37" cy="-21" r="2.2" fill="var(--ink)"/><rect x="0" y="0" width="44" height="16" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/><circle cx="10" cy="8" r="2" fill="var(--ink)"/><circle cx="19" cy="8" r="2" fill="var(--ink)" opacity=".45"/></g><text x="640" y="84" font-size="10.5" fill="var(--muted)" text-anchor="middle">AP</text><circle cx="510" cy="84" r="13" fill="var(--warn-bg)" stroke="var(--c3)" stroke-width="1.6"/><path d="M504.54 78.54 L515.46 89.46 M515.46 78.54 L504.54 89.46" stroke="var(--c3)" stroke-width="2.4" stroke-linecap="round"/><text x="510" y="112" font-size="10.5" fill="var(--c3)" text-anchor="middle">応答しない（一覧に出ない）</text>
</svg>
<figcaption>つなぐ側は名前を知っている必要が出るが、その端末が名前を呼ぶので結局は漏れる。「知らない人がうっかりつなぐ」を減らす設定であって、防御策ではない。</figcaption>
</figure>

</main>
</body>
</html>
