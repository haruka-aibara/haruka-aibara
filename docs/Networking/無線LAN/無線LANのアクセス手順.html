<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無線 LAN のアクセス手順</title>
<style>
:root{
  --bg:#fbfaf8; --card:#fff; --ink:#23201d; --muted:#6b645c; --line:#e3ded6;
  --lane:#eeeae4; --warn-bg:#fdf3f1; --warn-line:#e0b4ac;
  --c1:#3d6b9c; --c2:#b8562f; --c3:#5f8248; --c4:#7a63a0; --stop:#c2453a; --on:#fff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17161a; --card:#1e1d22; --ink:#e8e4dd; --muted:#9d968c; --line:#34323a;
    --lane:#2a2830; --warn-bg:#2a1e1d; --warn-line:#6b3b35;
    --c1:#5c8cc0; --c2:#cf6c42; --c3:#77a05c; --c4:#9680bd; --stop:#d75b4f; --on:#15141a;
  }
}
*{box-sizing:border-box}
body{
  margin:0;padding:2.5rem 1.25rem 5rem;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  line-height:1.85;font-size:16px;
}
main{max-width:52rem;margin:0 auto}
h1{font-size:1.9rem;line-height:1.35;margin:0 0 .4rem}
.lede{color:var(--muted);margin:0 0 2.5rem;font-size:1.02rem}
h2{font-size:1.25rem;margin:3rem 0 .6rem;padding-top:1.4rem;border-top:1px solid var(--line)}
h3{font-size:1.02rem;margin:1.8rem 0 .4rem}
p{margin:.7rem 0}
figure{margin:1.4rem 0;padding:1.1rem 1.1rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:10px}
figure svg{display:block;width:100%;height:auto}
figcaption{margin-top:.7rem;font-size:.86rem;color:var(--muted);line-height:1.7}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:.9rem 1.1rem;margin:1.4rem 0}
.note strong{color:var(--stop)}
table{border-collapse:collapse;width:100%;margin:1.2rem 0;font-size:.93rem}
th,td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
th{background:var(--lane);font-weight:600}
code{background:var(--lane);padding:.1em .4em;border-radius:4px;font-size:.9em}
ul{padding-left:1.3rem}li{margin:.35rem 0}
a{color:var(--c1)}
</style>
</head>
<body>
<main>

<h1>無線 LAN のアクセス手順</h1>
<p class="lede">「Wi-Fi につながった」までに、実は 3 つの段階を踏んでいる。</p>
<h2>探す → 認証 → 結び付け</h2>
<p>SSID を選んでパスワードを入れると一瞬でつながるように見えるが、内部では順番の決まった手順が走っている。トラブルの切り分けでは<strong>どの段階で止まったか</strong>が効くので、区切りだけ知っておくと役に立つ。</p>

<figure>
<svg viewBox="0 0 700 212" role="img" aria-label="接続完了までの4段階を階段で表した図">
<path d="M0 200 L0 164 L130 164 L130 132 L260 132 L260 100 L390 100 L390 68 L520 68 L520 44 L700 44 L700 200 Z" fill="var(--lane)" stroke="var(--line)" stroke-width="1.4" stroke-linejoin="round"/><path d="M72.7 111.6 A10 10 0 0 1 72.7 124.4" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.60"/><path d="M77.3 107.7 A16 16 0 0 1 77.3 128.3" fill="none" stroke="var(--c1)" stroke-width="1.4" stroke-linecap="round" opacity="0.47"/><g transform="translate(52,80) scale(0.95) rotate(0)"><circle cx="6" cy="6" r="5.5" fill="none" stroke="var(--c2)" stroke-width="2.4"/><line x1="11" y1="6" x2="26" y2="6" stroke="var(--c2)" stroke-width="2.4"/><line x1="21" y1="6" x2="21" y2="11" stroke="var(--c2)" stroke-width="2.2"/><line x1="16" y1="6" x2="16" y2="10.5" stroke="var(--c2)" stroke-width="2.2"/></g><path d="M52 128 h10 a8 8 0 0 1 0 16 h-10 M78 128 h10 a8 8 0 0 1 0 16 h-10 M60 136 h20" fill="none" stroke="var(--c4)" stroke-width="1.8" stroke-linecap="round" transform="translate(250,-78)"/><g transform="translate(444,7) scale(0.9)"><path d="M5.5 12 V8 a5.5 5.5 0 0 1 11 0 V12" fill="none" stroke="var(--c3)" stroke-width="2.2"/><rect x="1" y="12" width="20" height="16" rx="3" fill="var(--c3)"/><circle cx="11" cy="20" r="2.4" fill="var(--card)"/></g><text x="65" y="144" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600">① スキャン</text><text x="65" y="159" font-size="10" fill="var(--muted)" text-anchor="middle">近くの AP を探す</text><text x="195" y="112" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600">② 認証</text><text x="195" y="127" font-size="10" fill="var(--muted)" text-anchor="middle">つないでよい相手か</text><text x="325" y="80" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600">③ アソシエーション</text><text x="325" y="95" font-size="10" fill="var(--muted)" text-anchor="middle">この AP に所属する</text><text x="455" y="48" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="600">④ 鍵の交換</text><text x="455" y="63" font-size="10" fill="var(--muted)" text-anchor="middle">暗号鍵を決める</text><text x="610" y="70" font-size="11" fill="var(--c3)" text-anchor="middle" font-weight="600">通信できる</text><text x="610" y="90" font-size="10" fill="var(--muted)" text-anchor="middle">この後 DHCP で IP を</text><text x="610" y="106" font-size="10" fill="var(--muted)" text-anchor="middle">取ってようやく外に出られる</text><text x="455" y="152" font-size="10.5" fill="var(--c3)" text-anchor="middle">合言葉が違うとここで失敗する</text>
</svg>
<figcaption>「Wi-Fi マークは立っているのに外に出られない」は ④ まで終わって DHCP でつまずいた状態。「パスワードが違います」は ④ の失敗。</figcaption>
</figure>

<h2>参考</h2>
<ul>
<li><a href="https://standards.ieee.org/ieee/802.11/7028/">IEEE 802.11 — Wireless LAN MAC and PHY Specifications</a></li>
</ul>

</main>
</body>
</html>
